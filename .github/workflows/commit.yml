name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Pinnar npm para garantir paridade com lock file local
        run: npm install -g npm@11.16.0

      - name: Instalar dependências
        run: npm ci

      - name: Print versions
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version

      - name: Validate push commits with commitlint
        if: github.event_name == 'push'
        env:
          FROM_SHA: ${{ github.event.before }}
          TO_SHA: ${{ github.event.after }}
        run: |
          if [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$FROM_SHA" --to "$TO_SHA" --verbose
          fi

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  test-and-lint:
    name: Lint & Test Verification
    runs-on: ubuntu-latest
    needs: commitlint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Pinnar npm para garantir paridade com lock file local
        run: npm install -g npm@11.16.0

      - name: Instalar dependências
        run: npm ci

      - name: Verificar Formatação (Prettier)
        run: npm run format:check

      - name: Executar Linter (ESLint)
        run: npm run lint

      - name: Executar Testes (Vitest)
        run: npm test -- --run

      - name: Verificar Compilação (TypeScript)
        run: npm run build

      - name: Validar Empacotamento (Dry-Run)
        run: npm publish --dry-run --ignore-scripts
